<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeiterfassung · Internistische Praxis</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#154194"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm and clinical, a front-desk tool the whole team trusts
   IDEA: the staff sign-in board at a practice reception, one card per person
   PICTURE: big live clock and a grid of staff cards with their status
   COLOUR and TYPE: practice navy #154194, blue #2581c4, white, grey text; Raleway + Lato like the practice website
   LAYOUT: kiosk board on tablet/PC, admin area with tabs, wide tables */
:root{color-scheme:light;--navy:#154194;--blue:#2581c4;--sky:#2ea3f2;--ink:#2b2b2a;--text:#575756;--mute:#8a8a88;--bg:#f4f7fb;--panel:#fff;--line:#dde3ec;--soft:#e8f0fa;--ok:#1f7a4a;--okbg:#e3f4ea;--warn:#a86200;--warnbg:#fff3df;--bad:#b3261e;--badbg:#fde8e6}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Lato,"Open Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.raleway{font-family:Raleway,Lato,sans-serif;color:var(--navy)}
h2{font-size:22px;margin:0 0 12px;font-weight:700}
h3{font-size:17px;margin:18px 0 8px;font-weight:700}
.topbar{background:var(--navy);color:#fff;font-size:14px;padding:6px max(3vw,14px);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.topbar button{font:inherit;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:6px;min-height:32px;padding:2px 10px;cursor:pointer}
.topbar button[aria-pressed=true]{background:#fff;color:var(--navy)}
header.brand{background:#fff;border-bottom:1px solid var(--line);padding:10px max(3vw,14px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header.brand img{height:44px;width:auto;display:block}
.clockbox{text-align:right}.clockbox .t{font:700 34px/1 Raleway,sans-serif;color:var(--navy);font-variant-numeric:tabular-nums}.clockbox .d{font-size:14px;color:var(--mute)}
main{max-width:1180px;margin:0 auto;padding:18px max(3vw,14px) 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px;box-shadow:0 1px 2px rgba(21,65,148,.05)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.btn{font:700 16px Lato,sans-serif;min-height:48px;padding:8px 18px;border-radius:8px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.btn.pri{background:var(--navy);color:#fff}.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{border-color:var(--bad);color:var(--bad)}.btn.ghost{border-color:var(--line);color:var(--text)}
.btn.sm{min-height:40px;font-size:14px;padding:6px 12px}
.btn:disabled{opacity:.3;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px}
.f{display:grid;gap:4px;margin-bottom:10px}.f label,.lbl{font-size:13px;color:var(--mute);font-weight:700}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
@media(max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
/* kiosk board */
.hello{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin-top:6px}
.hello h1{font-size:clamp(26px,3.4vw,38px);margin:0;font-weight:700}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;font:inherit;color:inherit;display:grid;justify-items:center;gap:8px;min-height:190px;transition:transform .12s,box-shadow .12s;border-top:5px solid var(--line)}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,65,148,.12)}
.tile.in{border-top-color:var(--ok)}.tile.pause{border-top-color:var(--warn)}.tile.abs{border-top-color:var(--blue)}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 24px Raleway,sans-serif;background:linear-gradient(135deg,var(--blue),var(--navy));flex:none}
.av.sm{width:40px;height:40px;font-size:15px}
.tile .nm{font:700 17px Raleway,sans-serif;color:var(--ink)}.tile .role{font-size:13px;color:var(--mute);margin-top:-6px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--soft);color:var(--navy);white-space:nowrap}
.pill.in{background:var(--okbg);color:var(--ok)}.pill.pause{background:var(--warnbg);color:var(--warn)}.pill.out{background:#eef0f3;color:var(--mute)}.pill.bad{background:var(--badbg);color:var(--bad)}
.legend{font-size:14px;color:var(--mute)}
/* employee panel */
.emp-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.emp-head h2{margin:0}
.punch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.punch .btn{min-height:76px;font-size:20px}
.punch .wide{grid-column:1/-1}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:640px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi div{background:var(--bg);border-radius:10px;padding:12px;text-align:center}.kpi b{display:block;font:700 22px Raleway,sans-serif;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}.kpi span{font-size:13px;color:var(--mute)}
.pos{color:var(--ok)!important}.neg{color:var(--bad)!important}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}.tl li:last-child{border:0}
.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.alert{padding:12px 14px;border-radius:10px;font-weight:700;margin-top:12px}
.alert.info{background:var(--soft);color:var(--navy)}.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.bad{background:var(--badbg);color:var(--bad)}.alert.ok{background:var(--okbg);color:var(--ok)}
/* admin */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-top:8px}
.tabs button{font:600 15px Raleway,sans-serif;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;color:var(--text);cursor:pointer;min-height:44px}
.tabs button[aria-current=page]{color:var(--navy);border-bottom-color:var(--navy)}
.tabs .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:4px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:700;text-align:start;border-bottom:2px solid var(--navy);padding:8px 6px;white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
tr.we td{background:#f7f8fa;color:var(--mute)}tr.wk td{background:var(--soft);font-weight:700;color:var(--navy);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--navy);white-space:nowrap}
.tag.miss{background:var(--badbg);color:var(--bad)}.tag.pend{background:var(--warnbg);color:var(--warn)}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dayh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayh div{display:grid;gap:3px;text-align:center}.dayh span{font-size:12px;font-weight:700;color:var(--mute)}.dayh input{text-align:center;padding:6px 2px}
/* modal */
.dlg{position:fixed;inset:0;background:rgba(14,30,66,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.dlg.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px;padding:20px}
.pinpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:300px;margin:14px auto 0}
.pinpad button{font:700 26px Raleway,sans-serif;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--navy);cursor:pointer}
.pinpad button:active{background:var(--soft)}
.dots{display:flex;justify-content:center;gap:12px;margin-top:10px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy)}.dots i.on{background:var(--navy)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ev{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(110px,1fr) auto auto;gap:6px;margin-bottom:8px;align-items:center}
.nd{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);white-space:nowrap}.nd input{width:18px;min-height:18px}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:92vw;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.foot{font-size:12px;color:var(--mute);text-align:center;margin-top:24px}
@media(prefers-reduced-motion:reduce){.tile,.toast{transition:none}.shake{animation:none}}
</style>
</head>

<div class="topbar"><span id="tb-left"></span><span class="row" style="gap:6px"><button data-l="de">DE</button><button data-l="en">EN</button><button id="b-admin"></button></span></div>
<header class="brand"><img id="logo" alt="Internistische Praxis Linda Pars Pour"><div class="clockbox"><div class="t" id="clock">--:--</div><div class="d" id="date"></div></div></header>
<main id="view"></main>
<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

const STATES={BW:'Baden-Württemberg',BY:'Bayern',BE:'Berlin',BB:'Brandenburg',HB:'Bremen',HH:'Hamburg',HE:'Hessen',MV:'Mecklenburg-Vorpommern',NI:'Niedersachsen',NW:'Nordrhein-Westfalen',RP:'Rheinland-Pfalz',SL:'Saarland',SN:'Sachsen',ST:'Sachsen-Anhalt',SH:'Schleswig-Holstein',TH:'Thüringen'};
const holCache={};
function holidays(y,st){
  const ck=y+st;if(holCache[ck])return holCache[ck];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const em=Math.floor((h+l-7*m+114)/31),ed=((h+l-7*m+114)%31)+1,E=y+'-'+pad(em)+'-'+pad(ed);
  const r={},add=(k,n,s)=>{if(!s||s.includes(st))r[k]=n};
  add(y+'-01-01','Neujahr');add(addDays(E,-2),'Karfreitag');add(addDays(E,1),'Ostermontag');add(y+'-05-01','Tag der Arbeit');
  add(addDays(E,39),'Christi Himmelfahrt');add(addDays(E,50),'Pfingstmontag');add(y+'-10-03','Tag der Deutschen Einheit');
  add(y+'-12-25','1. Weihnachtstag');add(y+'-12-26','2. Weihnachtstag');
  add(y+'-01-06','Heilige Drei Könige',['BW','BY','ST']);add(y+'-03-08','Internationaler Frauentag',['BE','MV']);
  add(addDays(E,60),'Fronleichnam',['BW','BY','HE','NW','RP','SL']);add(y+'-08-15','Mariä Himmelfahrt',['SL']);
  add(y+'-09-20','Weltkindertag',['TH']);add(y+'-10-31','Reformationstag',['BB','MV','SN','ST','TH','HB','HH','NI','SH']);
  add(y+'-11-01','Allerheiligen',['BW','BY','NW','RP','SL']);
  const bb=new Date(y,10,23);do{bb.setDate(bb.getDate()-1)}while(bb.getDay()!==3);add(keyOf(bb),'Buß- und Bettag',['SN']);
  return holCache[ck]=r;
}
const holName=k=>holidays(+k.slice(0,4),S.settings.state)[k]||'';

/* ---------- maths ---------- */
const TYPES={work:['Arbeit','Work'],vac:['Urlaub','Vacation'],sick:['Krank','Sick'],hol:['Feiertag','Holiday'],comp:['Überstundenabbau','Time off in lieu']};
const REQ={vac:['Urlaub','Vacation'],sick:['Krankmeldung','Sick leave'],comp:['Überstundenabbau','Time off in lieu'],fix:['Zeitkorrektur','Time correction']};
const tn=t=>T(...TYPES[t]);
const EVN={in:['Kommen','Clock in'],break:['Pause','Break'],back:['Pause Ende','Break end'],out:['Gehen','Clock out']};
const evName=t=>T(...EVN[t]);
const absM=e=>toMin(e.at)+(e.nd?1440:0);
const sorted=ev=>[...(ev||[])].sort((a,b)=>absM(a)-absM(b));
const targetOf=(e,k)=>holName(k)?0:Math.round((+(e.plan||[])[parseKey(k).getDay()]||0)*60);
function liveNow(k){const n=new Date(),t=keyOf(n);if(k===t)return toMin(hm(n));if(k===addDays(t,-1))return toMin(hm(n))+1440;return null}
function calc(id,k){
  const day=daysOf(id)[k],r={gross:0,work:0,brk:0,start:'',end:'',breaks:[],state:'off',startM:null,endM:null};
  if(!day||!day.ev||!day.ev.length)return r;
  let mode='off',since=0,lab='';
  for(const e of sorted(day.ev)){
    const m=absM(e);
    if(mode==='work')r.work+=m-since;
    if(mode==='break'){r.brk+=m-since;r.breaks.push(lab+'–'+e.at)}
    if(e.t==='in'&&r.startM===null){r.start=e.at;r.startM=m}
    if(e.t==='out'){r.end=e.at+(e.nd?' (+1)':'');r.endM=m}
    mode=e.t==='in'||e.t==='back'?'work':e.t==='break'?'break':'done';since=m;lab=e.at;
  }
  const now=liveNow(k);if(now!==null&&(mode==='work'||mode==='break')){const dd=Math.max(0,now-since);mode==='work'?r.work+=dd:r.brk+=dd}
  r.gross=r.work+r.brk;r.state=mode;return r;
}
function activeKey(id){
  const n=new Date(),t=keyOf(n),y=addDays(t,-1),d=daysOf(id)[t];
  if((!d||!d.ev||!d.ev.length)&&n.getHours()<12){const st=calc(id,y).state;if(st==='work'||st==='break')return y}
  return t;
}
const reqFor=(id,k,status)=>S.reqs.find(r=>r.emp===id&&r.type!=='fix'&&r.status===status&&k>=r.from&&k<=r.to);
function dayInfo(id,k){
  const e=S.emps[id],d=daysOf(id)[k],c=calc(id,k),target=targetOf(e,k),t=today(),hol=holName(k);
  const ap=reqFor(id,k,'approved'),pend=reqFor(id,k,'pending');
  let type=ap?ap.type:(d&&d.ev&&d.ev.length?'work':(hol?'hol':''));
  let ist=0,counted=true,missing=false;
  if(type==='vac'||type==='sick')ist=target;
  else if(type==='hol'||type==='comp')ist=0;
  else if(type==='work'){ist=c.work;if(c.state!=='done'&&(k===t||k===activeKey(id)))counted=false}
  else{if(k>=t)counted=false;else if(target>0&&!pend)missing=true}
  if(k<(e.trackFrom||'0000'))counted=false;
  if(k>t)counted=false;
  return {k,type,c,target,ist,diff:ist-target,counted,missing,hol,pend,note:d&&d.note||''};
}
function balance(id,upTo){
  const e=S.emps[id];let b=Math.round((+e.otOpen||0)*60),k=e.trackFrom||today(),end=upTo<today()?upTo:today(),g=0;
  while(k<=end&&g++<4000){const i=dayInfo(id,k);if(i.counted)b+=i.diff;k=addDays(k,1)}return b;
}
const vacTaken=(id,y)=>{let n=0;for(const r of S.reqs)if(r.emp===id&&r.type==='vac'&&r.status==='approved'){let k=r.from<y+'-01-01'?y+'-01-01':r.from;const end=r.to>y+'-12-31'?y+'-12-31':r.to;while(k<=end){if(targetOf(S.emps[id],k)>0)n++;k=addDays(k,1)}}return n};
function monthRows(id,m){const[yy,mm]=m.split('-').map(Number),n=new Date(yy,mm,0).getDate();return Array.from({length:n},(_,i)=>dayInfo(id,m+'-'+pad(i+1)))}
function monthStats(id,m){
  const rows=monthRows(id,m);let soll=0,ist=0,diff=0,work=0,vac=0,sick=0,miss=0,brk=0,gross=0;
  for(const r of rows){if(!r.counted)continue;soll+=r.target;ist+=r.ist;diff+=r.diff;if(r.type==='work'&&r.c.work>0){work++;brk+=r.c.brk;gross+=r.c.gross}if(r.type==='vac'&&r.target)vac++;if(r.type==='sick'&&r.target)sick++;if(r.missing)miss++}
  const e=S.emps[id],y=m.slice(0,4);
  return {rows,soll,ist,diff,work,vac,sick,miss,brk,gross,bal:balance(id,rows[rows.length-1].k),vacLeft:(+e.vacYear||0)+(+e.vacCarry||0)-vacTaken(id,y)};
}
function warnings(id,k){
  const c=calc(id,k),w=[];if(c.startM===null)return w;
  if(c.work>360&&c.brk<30)w.push(T('Über 6 Std. Arbeit, weniger als 30 Min. Pause (§4 ArbZG)','Over 6 h work, under 30 min break (§4 ArbZG)'));
  if(c.work>540&&c.brk<45)w.push(T('Über 9 Std. Arbeit, weniger als 45 Min. Pause (§4 ArbZG)','Over 9 h work, under 45 min break (§4 ArbZG)'));
  if(c.work>600)w.push(T('Über 10 Std. Arbeit an einem Tag (§3 ArbZG)','Over 10 h work in one day (§3 ArbZG)'));
  const p=calc(id,addDays(k,-1));if(p.endM!==null){const rest=c.startM+1440-p.endM;if(rest<660)w.push(T('Weniger als 11 Std. Ruhezeit ('+fmt(rest)+') (§5 ArbZG)','Under 11 h rest ('+fmt(rest)+') (§5 ArbZG)'))}
  return w;
}
function isoWeek(k){const d=parseKey(k);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
function status(id){
  const t=today(),ap=reqFor(id,t,'approved');
  const st=calc(id,activeKey(id)).state;
  if(st==='work')return['in',T('Anwesend','Present')];

  const tb=ev.target.closest('[data-tab]');if(tb){adminTab=tb.dataset.tab;render();return}
  const ed=ev.target.closest('[data-edit]');if(ed){const[i,k]=ed.dataset.edit.split('|');editDay(i,k);return}
  const go=ev.target.closest('[data-goto]');if(go){repEmp=go.dataset.goto;adminTab='times';render();return}
  const ok=ev.target.closest('[data-ok]');if(ok){decide(ok.dataset.ok,true);return}
  const no=ev.target.closest('[data-no]');if(no){decide(no.dataset.no,false);return}
  const sf=ev.target.closest('[data-staff]');if(sf){staffForm(sf.dataset.staff);return}
});
document.addEventListener('keydown',armIdle);
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDlg()});

load();$('logo').src=LOGO;
mode=S.settings.adminHash?'home':'setup';render();
setInterval(()=>{tick();if(mode==='home'&&!$('dlg').classList.contains('on'))renderHome()},20000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{})}
}
</script>
